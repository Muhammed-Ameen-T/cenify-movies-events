services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_OPTIONS=--max_old_space_size=512
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  mern-network:
    driver: bridge
