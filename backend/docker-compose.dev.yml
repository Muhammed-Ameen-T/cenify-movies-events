version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NODE_ENV: development
    environment:
      - NODE_OPTIONS=--max_old_space_size=2048
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    networks:
      - mern-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  mern-network:
    driver: bridge
